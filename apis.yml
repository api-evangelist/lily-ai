aid: lily-ai
name: Lily AI
description: >-
  Lily AI, Inc. is a retail product-intelligence company whose platform, Lily Max, enriches
  e-commerce product catalogs so that products are legible to advertising platforms, search
  engines, onsite search, and AI shopping agents. Agents identify gaps in a retailer's product
  data, generate consumer-centric attributes and copy, run controlled tests against a holdout,
  and deploy the winning enrichments across Google Merchant Center feeds, Meta Commerce Manager
  catalogs, AI discovery and agentic commerce surfaces, and onsite PDP, search, and faceting.
  Lily AI sells to enterprise retailers, brands, and agencies and positions itself as a layer
  over the existing commerce stack rather than a replacement for a PIM or feed manager. The
  company raised a $25M Series B with participation from Canaan Partners, Conductive Ventures,
  Sorenson Ventures, and NEA. As of this enrichment pass Lily AI publishes no public developer
  portal, API reference, OpenAPI definition, SDKs, or GitHub organization; the platform is
  delivered as a managed enterprise service with onboarding handled through sales.
