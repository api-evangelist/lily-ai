apis:
- name: LilyApp Middleware API
  description: >-
    The middleware API behind Lily AI's customer application at app.lily.ai. Publicly
    served with a Swagger UI at /api and an OpenAPI 3.0.0 contract at /api-json (63
    paths, 100 operations, 41 schemas), covering retailer/subsidiary configuration,
    product search over Lily's consumer-centric attribute tags and synonyms, product
    analytics and search-term trends, AI product-copy generation and batch review,
    outbound partner integration configuration, and a set of pass-through proxies to
    Lily's internal product-intelligence, connector, config, TCE and enrichment-platform
    services. Calls require a bearer JWT issued by Lily AI's Azure AD B2C tenant; Lily AI
    publishes no developer documentation and offers no self-service way to obtain one.
  humanURL: https://lilyapp-api-prd.pub.lilyai.net/api
  baseURL: https://lilyapp-api-prd.pub.lilyai.net
