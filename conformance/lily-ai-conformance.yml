compliance_programs:
  certifications_named: []
  trust_center: https://trust.lily.ai/
  note: >-
    Lily AI runs a Drata-hosted trust center at trust.lily.ai (CNAME
    trust.cname.drata.com), which is where any SOC 2 / ISO 27001 attestation would
    be listed — but it sits behind a Cloudflare managed bot challenge (HTTP 403 to
    every automated client), so NO certification can be named from evidence. The
    public https://www.lily.ai/security page names none either; it claims only
    "encryption in transit and at rest", least-privilege access, server-side
    secrets, validated inputs, access logging, and that it "aligns with industry
    standards and customer requirements". Because no certification is verifiable, NO
    `Compliance` pointer is emitted. See security/lily-ai-trust-center.yml.
