notes: >-
  The status page names an `ai-mcp-server` component, a `webhook-receiver`, a
  `platform-gateway`, and an `integration-api-service`. These indicate an
  internal MCP, webhook, and API surface exists in production, but none of it is
  publicly documented, reachable, or offered to developers. Per the pipeline's
  no-fabrication rule, no MCPServer, Webhooks, or AsyncAPI pointer is emitted on
  the strength of a status-page component name alone. Re-check on a later pass if
  Lily AI opens a developer program — the `ai-mcp-server` component makes them a
  plausible near-term MCP publisher.
  UPDATE 2026-08-12: one of those surfaces turned out to be reachable after all.
  The production JavaScript bundle at app.lily.ai names
  https://lilyapp-api-prd.pub.lilyai.net as its API base; that host serves a public
  Swagger UI at /api and an OpenAPI 3.0.0 contract at /api-json (100 operations,
  41 schemas), harvested this pass. It is the customer application's middleware,
  not a developer product — no portal, no reference, no SDK, no credential path —
  but it is genuinely published, so it is now captured in openapi/. The MCP,
  webhook and integration components remain unreachable and unpointered.
