components:
  securitySchemes:
    JWT:
      scheme: bearer
      bearerFormat: JWT
      type: http
      in: header
  schemas:
    SubsidiaryDto:
      type: object
      properties:
        code:
          type: string
        id:
          type: number
        name:
          type: string
        brands:
          type: array
          items:
            type: string
      required:
      - code
      - id
      - name
      - brands
    PersonProductTypesDto:
      type: object
      properties:
        personTypes:
          type: array
          items:
            type: string
        productTypes:
          type: array
          items:
            type: string
      required:
      - personTypes
      - productTypes
    RetailerInfoDto:
      type: object
      properties:
        hasSubidiaries:
          type: boolean
        isSubsidiary:
          type: boolean
        hasOrIsSubsidiary:
          type: boolean
      required:
      - hasSubidiaries
      - isSubsidiary
      - hasOrIsSubsidiary
    BrandDto:
      type: object
      properties:
        code:
          type: string
        id:
          type: number
        name:
          type: string
      required:
      - code
      - id
      - name
    ProductOldDto:
      type: object
      properties:
        lily_product_id:
          type: number
        parent_sku_code:
          type: string
        sku_id:
          type: string
        title:
          type: string
        description:
          type: string
        brand:
          type: string
        product_type:
          type: string
        person_type:
          type: string
        images:
          type: array
          items:
            type: string
        retailer_tag_sections:
          type: object
        processing_completion_date:
          type: string
      required:
      - lily_product_id
      - parent_sku_code
      - sku_id
      - title
      - description
      - brand
      - product_type
      - person_type
      - images
      - retailer_tag_sections
      - processing_completion_date
    SearchOldResponseDto:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        page:
          type: string
        per_page:
          type: string
        retailer:
          type: string
        total_count:
          type: number
        products:
          description: Array of products.
          type: array
          items:
            $ref: '#/components/schemas/ProductOldDto'
      required:
      - success
      - message
      - page
      - per_page
      - retailer
      - total_count
      - products
    SubsidiaryTagsDto:
      type: object
      properties:
        category:
          type: object
        label:
          type: string
        tags:
          type: array
          items:
            type: string
      required:
      - category
      - label
      - tags
    SearchPAMPayloadDto:
      type: object
      properties:
        brand:
          type: string
        keywords:
          type: array
          items:
            type: string
        person_types:
          type: array
          items:
            type: string
        product_types:
          type: array
          items:
            type: string
        sku_id:
          type: string
        subsidiary_tags:
          type: array
          items:
            $ref: '#/components/schemas/SubsidiaryTagsDto'
      required:
      - brand
    TagsWithSynonyms:
      type: object
      properties:
        tag:
          type: string
        synonyms:
          type: array
          items:
            type: string
      required:
      - tag
      - synonyms
    TagSections:
      type: object
      properties:
        category:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagsWithSynonyms'
      required:
      - category
      - tags
    ProductDtoWithSynonym:
      type: object
      properties:
        productId:
          type: number
        skuId:
          type: string
        title:
          type: string
        description:
          type: string
        brand:
          type: string
        productType:
          type: string
        personType:
          type: string
        images:
          type: array
          items:
            type: string
        tagSections:
          type: array
          items:
            $ref: '#/components/schemas/TagSections'
        lastExportedOn:
          type: string
        processedOn:
          type: string
        variantOf:
          type: string
        tagCount:
          type: number
      required:
      - productId
      - skuId
      - title
      - description
      - brand
      - productType
      - personType
      - images
      - tagSections
      - lastExportedOn
      - processedOn
      - variantOf
      - tagCount
    PaginationDto:
      type: object
      properties:
        pageNumber:
