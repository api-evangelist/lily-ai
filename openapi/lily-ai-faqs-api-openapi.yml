        required: true
        in: path
        description: SKU ID
        schema:
          type: string
      responses:
        '200':
          description: ''
      security:
      - JWT: []
      tags:
      - Faqs
    options:
      operationId: FaqProxyController_proxy_options
      parameters:
      - name: skuId
        required: true
        in: path
        description: SKU ID
        schema:
          type: string
      responses:
        '200':
          description: ''
      security:
      - JWT: []
      tags:
      - Faqs
    head:
      operationId: FaqProxyController_proxy_head
      parameters:
      - name: skuId
        required: true
        in: path
        description: SKU ID
        schema:
          type: string
      responses:
        '200':
          description: ''
      security:
      - JWT: []
      tags:
      - Faqs
components:
  securitySchemes:
    JWT:
      scheme: bearer
      bearerFormat: JWT
      type: http
